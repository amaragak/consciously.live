name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/marketing/**"
      - "frontend/webapp/**"
      - "frontend/common/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      force_backend:
        description: "Deploy backend even if paths unchanged"
        type: boolean
        default: false
      force_marketing:
        description: "Deploy marketing (Next) even if paths unchanged"
        type: boolean
        default: false
      force_app:
        description: "Deploy app (Vite SPA) even if paths unchanged"
        type: boolean
        default: false
      force_frontend:
        description: "Deploy both marketing + app (overrides the two above)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      marketing: ${{ steps.filter.outputs.marketing }}
      app: ${{ steps.filter.outputs.app }}
      shared: ${{ steps.filter.outputs.shared }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            marketing:
              - 'frontend/marketing/**'
            app:
              - 'frontend/webapp/**'
            shared:
              - 'frontend/common/**'
            workflow:
              - '.github/workflows/deploy.yml'

  deploy:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.marketing == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/marketing/deploy/package-lock.json
            package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Decide what to deploy
        id: plan
        run: |
          set -euo pipefail

          BACKEND="${{ needs.changes.outputs.backend }}"
          MARKETING="${{ needs.changes.outputs.marketing }}"
          APP="${{ needs.changes.outputs.app }}"
          SHARED="${{ needs.changes.outputs.shared }}"
          WORKFLOW="${{ needs.changes.outputs.workflow }}"

          # Shared packages (and workflow edits) rebuild both frontends.
          if [ "$SHARED" = "true" ] || [ "$WORKFLOW" = "true" ]; then
            MARKETING=true
            APP=true
          fi

          # Backend CFN outputs are baked into both frontends at build time
          # (NEXT_PUBLIC_* for marketing, VITE_* for the SPA). Redeploy both when
          # the API/media/chat URLs may have changed.
          if [ "$BACKEND" = "true" ]; then
            MARKETING=true
            APP=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_backend }}" = "true" ]; then
              BACKEND=true
            fi
            if [ "${{ inputs.force_frontend }}" = "true" ]; then
              MARKETING=true
              APP=true
            else
              if [ "${{ inputs.force_marketing }}" = "true" ]; then
                MARKETING=true
              fi
              if [ "${{ inputs.force_app }}" = "true" ]; then
                APP=true
              fi
            fi
            # Manual run with no force flags and no path hits: deploy everything.
            if [ "$BACKEND" != "true" ] && [ "$MARKETING" != "true" ] && [ "$APP" != "true" ]; then
              BACKEND=true
              MARKETING=true
              APP=true
            fi
          fi

          FRONTEND=false
          if [ "$MARKETING" = "true" ] || [ "$APP" = "true" ]; then
            FRONTEND=true
          fi

          ONLY=all
          if [ "$MARKETING" = "true" ] && [ "$APP" != "true" ]; then
            ONLY=marketing
          elif [ "$APP" = "true" ] && [ "$MARKETING" != "true" ]; then
            ONLY=app
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "Plan: backend=$BACKEND marketing=$MARKETING app=$APP only=$ONLY"

      - name: Install backend dependencies
        if: steps.plan.outputs.backend == 'true'
        working-directory: backend
        run: npm ci

      - name: Deploy backend (CDK)
        if: steps.plan.outputs.backend == 'true'
        working-directory: backend
        env:
          MEDIMADE_AUTH_EMAIL_FROM: ${{ secrets.MEDIMADE_AUTH_EMAIL_FROM }}
          MEDIMADE_AUTH_WEBAPP_ORIGIN: ${{ secrets.MEDIMADE_AUTH_WEBAPP_ORIGIN }}
          # Include ConsciouslyBackend in the CDK app (MedimadeStack remains defined; not torn down).
          CONSCIOUSLY_STACK: "1"
        run: |
          ./scripts/deploy-back ConsciouslyBackend -c consciouslyStack=true --require-approval never

      # Before any frontend build, pull NEXT_PUBLIC_* from the live stack
      # (covers frontend-only and back+front — no GitHub secrets for those URLs).
      - name: Sync webapp .env from CloudFormation outputs
        if: steps.plan.outputs.frontend == 'true'
        run: |
          node backend/scripts/write-webapp-env-from-outputs.mjs \
            --stack ConsciouslyBackend \
            --region "${{ vars.AWS_REGION || 'eu-west-2' }}" \
            frontend/marketing/.env \
            frontend/mobile/.env \
            frontend/extension/.env
          if [ -f frontend/marketing/.env ]; then
            set -a
            # shellcheck disable=SC1091
            source frontend/marketing/.env
            set +a
            {
              echo "VITE_MEDIMADE_API_URL=${NEXT_PUBLIC_MEDIMADE_API_URL:-}"
              echo "VITE_MEDIMADE_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIMADE_MEDIA_BASE_URL:-}"
              echo "VITE_MEDIMADE_CHAT_URL=${NEXT_PUBLIC_MEDIMADE_CHAT_URL:-}"
              echo "VITE_ASSISTANT_CHAT_URL=${NEXT_PUBLIC_ASSISTANT_CHAT_URL:-}"
              echo "VITE_MARKETING_ORIGIN=https://consciously.live"
            } > frontend/webapp/.env
          fi

      # Marketing + webapp + @consciously/common are npm workspaces — install from
      # repo root only. Never `npm ci --prefix frontend/marketing` (that treats the
      # private workspace package as a registry dependency and 404s).
      - name: Install frontend workspace dependencies
        if: steps.plan.outputs.frontend == 'true'
        run: npm ci

      - name: Install SST deploy tooling
        if: steps.plan.outputs.frontend == 'true'
        working-directory: frontend/marketing/deploy
        run: |
          npm ci
          npm run install-platform

      - name: Deploy frontend (SST prod)
        if: steps.plan.outputs.frontend == 'true'
        working-directory: frontend/marketing/deploy
        env:
          # Prod must keep consciously.live + ACM on the live CloudFront distro.
          # Default attach=1. Set repo Actions var MEDIMADE_SST_ATTACH_DOMAIN=0 only
          # for temporary cloudfront.net previews (DNS must not point at that distro).
          MEDIMADE_SST_ATTACH_DOMAIN: ${{ vars.MEDIMADE_SST_ATTACH_DOMAIN || '1' }}
          # SPA attaches app.consciously.live (ACM d1efcdd8…). Set repo var to 0
          # only for temporary cloudfront.net previews.
          MEDIMADE_SPA_ATTACH_DOMAIN: ${{ vars.MEDIMADE_SPA_ATTACH_DOMAIN || '1' }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ vars.NEXT_PUBLIC_APP_ORIGIN || 'https://app.consciously.live' }}
        run: ./deploy-web --stage production --only "${{ steps.plan.outputs.only }}"
