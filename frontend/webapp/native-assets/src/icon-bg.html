<!doctype html>
<html>
  <head>
    <style>
      /* Adaptive-icon background: same zoomed paisley navy as icon.html. */
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
        background: #1a1820;
      }
      body {
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.7;
        background: url("../../public/patterns/paisley-dark-duotone.webp")
          center / 3800px 3800px repeat;
      }
    </style>
  </head>
  <body></body>
</html>
